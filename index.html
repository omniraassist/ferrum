<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ferrum</title>
<meta name="description" content="Diario de fuerza: apunta tus series y mira tus récords.">
<meta name="theme-color" content="#0E0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ferrum">
<link rel="apple-touch-icon" href="trazo-180.png">
<link rel="icon" type="image/png" href="trazo-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna de app nativa con pestañas flotantes (Entreno · Historial · Progreso · Récords).
   Dirección: app de fitness moderna en modo oscuro fijo — negro carbón, tarjetas grafito sin bordes y muy redondeadas,
   un único acento verde lima con texto negro para lo importante (récords, botón de apuntar, selección). */
:root{
  --bg:#0E0E10; --surface:#1B1B1E; --surface-2:#242428; --surface-3:#2F2F34; --line:#2A2A2F; --line-2:#38383E;
  --ink:#F5F5F2; --muted:#9B9BA3; --faint:#5F5F67;
  --lime:#D6F65A; --lime-ink:#DDF970; --lime-soft:#262B14; --on-lime:#0E0E10;
  --gold:var(--lime); --gold-ink:var(--lime-ink); --gold-deep:#B5D53A; --gold-soft:var(--lime-soft); --on-gold:var(--on-lime);
  --danger:#FF7066; --ok:var(--lime);
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,label,input{touch-action:manipulation}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px}
.mark{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--surface);display:block;flex:none}
.brand{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand small{font-size:12.5px;color:var(--muted);font-weight:500}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:7px 12px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"]::before{background:var(--lime)}
.sync[data-s="pend"]::before{background:#F5C451}
.sync[data-s="err"]::before{background:var(--danger)}

/* Cabeceras */
.hero{padding-block:14px 16px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-row > .label::first-letter{text-transform:uppercase}
.datepill{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink);min-height:36px;flex:none}
.datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.hero-acts{display:flex;gap:6px;flex:none}
.datepill.nueva{background:var(--lime);color:var(--on-lime);font-weight:800}
.hero h1,.det h1{margin:8px 0 0;font-weight:800;font-size:clamp(30px,8.6vw,38px);line-height:1.05;letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere}
.editg{margin-top:12px;font-size:13px;color:var(--lime-ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.editg::after{content:"→"}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--surface);border-radius:18px;padding:12px;min-width:0}
.stats .v{font-weight:800;font-size:20px;line-height:1.1;margin-top:4px;white-space:nowrap;letter-spacing:-.02em}
.stats .v small{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.aviso{background:var(--surface);border-radius:18px;padding:12px 14px;font-size:13.5px;color:var(--muted);margin-bottom:14px}

/* Tarjetas */
.card{background:var(--surface);border-radius:26px;padding:18px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.card-h h2,.next h2{margin:0;font-weight:800;font-size:18px;letter-spacing:-.02em}
.card-h .r{font-size:12.5px;color:var(--muted);text-align:right}
.card-h .r b{color:var(--ink);font-size:15px;font-weight:800}

/* Planificador */
.next{margin-top:12px;background:var(--surface);border-radius:26px;padding:20px 18px}
.next > p{margin:4px 0 16px;font-size:13.5px;color:var(--muted)}
.plan > .label{color:var(--lime-ink)}
.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;min-height:42px;background:var(--surface-2);color:var(--muted);transition:background .15s,color .15s}
.gchip[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.gchip.sm{padding:7px 13px;min-height:34px;font-size:13px}
.plan-actions{display:flex;gap:10px;margin-top:18px}
.plan-actions .apuntar{flex:1}

/* Bloques de ejercicio */
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border-radius:26px;overflow:hidden}
.ex.on{background:var(--surface);box-shadow:0 0 0 1.5px var(--surface-3)}
.ex-h{display:flex;align-items:center;gap:12px;padding:16px 14px 16px 16px;width:100%;text-align:left}
.ex-n{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.ex.on .ex-n{background:var(--lime);color:var(--on-lime)}
.ex-t{flex:1;min-width:0;text-align:left}
.ex-t .nm{display:block;font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.ex-t .sm{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.ex-t .sm b{color:var(--ink);font-weight:700}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none}
.ex-body{padding:0 16px 16px}
.editbtn{flex:none;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:36px}
.editbtn[aria-expanded="true"]{background:var(--lime);color:var(--on-lime)}
.swap,.askg{background:var(--surface-2);border-radius:20px;padding:14px;margin-bottom:12px}
.swap > .label,.askg .label{display:block;margin-bottom:10px}
.swap .search{background:var(--surface)}

/* Récords: tarjeta lima */
.pr{border-radius:22px;background:var(--lime);color:var(--on-lime);padding:16px}
.pr .label{color:rgba(14,14,16,.6)}
.pr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pr-h h4{margin:0;font-weight:800;font-size:16px;letter-spacing:-.02em}
.pr-h small{font-size:12px;font-weight:700;background:rgba(14,14,16,.1);border-radius:999px;padding:4px 10px}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.pr-item{min-width:0}
.pr-item .v{font-weight:800;font-size:30px;line-height:1.05;margin-top:4px;white-space:nowrap;letter-spacing:-.04em}
.pr-item .v small{font-size:12.5px;font-weight:700;opacity:.6;margin-left:3px;letter-spacing:0}
.pr-item .d{font-size:12px;font-weight:600;opacity:.65;margin-top:2px}
.reps{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.reps::-webkit-scrollbar{display:none}
.rep{flex:none;background:var(--on-lime);color:var(--ink);border-radius:14px;padding:7px 11px;min-width:64px}
.rep .r{font-size:10.5px;font-weight:700;color:var(--lime-ink)}
.rep .w{font-weight:800;font-size:15px;white-space:nowrap}
.last{margin-top:12px;font-size:13px;font-weight:600;color:rgba(14,14,16,.65);line-height:1.5}
.last b{color:var(--on-lime);font-weight:800}
.first{background:var(--surface-2);border-radius:20px;padding:16px;font-size:13.5px;color:var(--muted)}
.first b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:2px}

/* Series */
.sets{margin-top:14px}
.sets > .label{display:block;margin-bottom:6px}
.setrow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:50px}
.setrow:last-child{border-bottom:0}
.setrow .i{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.setrow .w{font-weight:800;font-size:18px;white-space:nowrap;letter-spacing:-.02em}
.setrow .w small{font-size:12px;color:var(--muted);font-weight:600;margin:0 4px 0 2px}
.setrow .x{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--lime);color:var(--on-lime);display:inline-block}
.tag.soft{background:var(--lime-soft);color:var(--lime-ink)}
.del{color:var(--danger);font-weight:700;font-size:13px;background:rgba(255,112,102,.12);border-radius:999px;padding:6px 12px}

/* Registro */
.logger{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{background:var(--surface-2);border-radius:20px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;min-width:0;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s}
.step .label{font-size:11px}
.step-row{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;width:100%;gap:2px}
.step-row button{width:36px;height:36px;border-radius:50%;background:var(--surface-3);font-size:20px;color:var(--ink);display:grid;place-items:center;justify-self:center}
.step-row button:active{background:var(--lime);color:var(--on-lime)}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:800;font-size:30px;letter-spacing:-.04em;line-height:1.1;padding:2px 0;font-variant-numeric:tabular-nums;outline:none}
.step input::placeholder{color:var(--faint)}
.step:focus-within{box-shadow:inset 0 0 0 1.5px var(--lime)}
.apuntar{grid-column:1/-1;min-height:56px;border-radius:999px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;background:var(--lime);color:var(--on-lime)}
.apuntar::after{content:"→";font-weight:700}
.apuntar:disabled::after{content:none}
.apuntar:active{transform:scale(.985)}
.ghost{min-height:56px;border-radius:999px;padding:0 20px;font-weight:700;background:var(--surface-2)}
.hint{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted)}
.hint.err{color:var(--danger)}
.ex-menu{display:flex;flex-direction:column;gap:14px}
.ex-menu .row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;min-height:38px;background:var(--surface-2)}
.chip.danger{color:var(--danger)}
.chip.danger.sure{background:var(--danger);color:#160806}

/* Buscador */
.search{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:999px;padding:0 6px 0 16px;min-height:54px;box-shadow:inset 0 0 0 1.5px transparent}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--lime)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:500;padding:12px 0;outline:none}
.search input::placeholder{color:var(--faint)}
.search .go{height:42px;padding:0 16px;border-radius:999px;background:var(--lime);color:var(--on-lime);font-weight:800;font-size:14px;flex:none}
.res{display:flex;flex-direction:column;margin-top:6px}
.res-h{margin:16px 0 4px}
.hit{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:56px}
.hit:last-child{border-bottom:0}
.hit .n{font-weight:700;font-size:15px;overflow-wrap:anywhere;min-width:0}
.hit .n mark{background:none;color:var(--lime-ink)}
.hit .s{display:block;font-size:12px;color:var(--muted);font-weight:500}
.hit .b{font-weight:800;font-size:16px;text-align:right;white-space:nowrap}
.hit .b small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.hit.nuevo .n{color:var(--lime-ink)}

/* Historial */
.month{margin:22px 0 10px}
.month .label::first-letter{text-transform:uppercase}
.rows{background:var(--surface);border-radius:26px;overflow:hidden}
.srow{display:grid;grid-template-columns:50px 1fr auto;gap:14px;align-items:center;padding:14px 14px 14px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:78px}
.srow:last-child{border-bottom:0}
.dd{width:50px;height:54px;border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dd b{display:block;font-weight:800;font-size:20px;line-height:1}
.dd span{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:capitalize}
.srow .mid{min-width:0}
.srow .tt{display:block;font-weight:800;font-size:15.5px;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.srow .meta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.srow .exs{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.srow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--faint)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumrow div{background:var(--surface);border-radius:18px;padding:12px}
.sumrow .v{font-weight:800;font-size:22px;margin-top:4px;letter-spacing:-.02em}
.sx{background:var(--surface);border-radius:24px;padding:16px 16px 8px;margin-bottom:10px}
.sx h3{margin:0;font-weight:800;font-size:17px;letter-spacing:-.02em}
.sx .g{font-size:12px;color:var(--muted)}
.foot-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* Progreso */
.week{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border-radius:26px;padding:18px;margin-bottom:12px}
.week .big{font-weight:800;font-size:30px;line-height:1;margin-top:6px;white-space:nowrap;letter-spacing:-.03em}
.week .big small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px;letter-spacing:0}
.wdots{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.wdot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:11px;color:var(--faint)}
.wdot.on{background:var(--lime);color:var(--on-lime)}
.chart{padding:4px 0 0}
.chart svg{display:block;width:100%;height:auto}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{padding:8px 4px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.hbar{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;font-weight:600}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--lime)}
.hbar .c{text-align:right;font-weight:800}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.filters::-webkit-scrollbar{display:none}
.filters .gchip{flex:none}
.sec-h{margin:22px 0 10px}
.sec-h h2{margin:0;font-weight:800;font-size:18px;letter-spacing:-.02em}
.prow{display:grid;grid-template-columns:1fr auto 64px;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line);min-height:66px}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:700;overflow-wrap:anywhere;min-width:0}
.prow .sub{display:block;font-size:12px;color:var(--muted);font-weight:500}
.prow .kg{font-weight:800;font-size:18px;text-align:right;white-space:nowrap;letter-spacing:-.02em}
.prow .kg small{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.prow svg{display:block}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;font-weight:700;font-size:13.5px;padding:8px 14px;min-height:38px}
.det > p{margin:6px 0 16px;color:var(--muted);font-size:13.5px}
.det > .label{display:block;margin-top:14px}
.det > .label::first-letter{text-transform:uppercase}
.hrow{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow .d{font-size:12px;font-weight:700;color:var(--muted);padding-top:2px}
.hrow .s{font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--muted)}
.hrow .s b{color:var(--ink);font-weight:800}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px;background:var(--surface);border-radius:26px}
.empty b{display:block;color:var(--ink);font-size:20px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}

/* Aviso de récord y pestañas */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 60px));visibility:hidden;z-index:30;
  background:var(--lime);color:var(--on-lime);border-radius:24px;padding:14px 22px;min-width:240px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 18px 40px -10px rgba(0,0,0,.7);transition:transform .45s cubic-bezier(.2,.9,.25,1.15),visibility 0s linear .45s}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.25,1.15),visibility 0s}
.toast .label{color:rgba(14,14,16,.65)}
.toast b{display:block;font-weight:800;font-size:22px;margin-top:2px;letter-spacing:-.03em}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:16;
  display:grid;grid-template-columns:repeat(var(--tabs,4),1fr);gap:2px;padding:6px;border-radius:28px;width:min(calc(100% - 32px),390px);
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 16px 36px -12px rgba(0,0,0,.7),inset 0 0 0 1px var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);border-radius:22px;min-height:52px}
.tab[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.tab[hidden]{display:none}

@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.setrow.nuevo{animation:in .35s ease-out}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hit .b .rl{display:block;font-size:10.5px;font-weight:800;color:var(--lime-ink);margin-bottom:1px}
.goal{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--on-lime);color:var(--ink);border-radius:14px;padding:10px 12px}
.goal span{font-size:12px;font-weight:700;color:var(--lime-ink)}
.goal b{font-weight:800;font-size:16px;white-space:nowrap}
.finbtn{width:100%;margin-top:12px;min-height:56px;border-radius:999px;font-weight:800;font-size:16px;color:var(--lime-ink);box-shadow:inset 0 0 0 1.5px var(--lime);display:flex;align-items:center;justify-content:center;gap:8px}
.finbtn::before{content:"✓"}
.fin-card{background:var(--lime);color:var(--on-lime);border-radius:26px;padding:20px}
.fin-card .label{color:rgba(14,14,16,.6)}
.fin-card h2{margin:4px 0 16px;font-size:30px;font-weight:800;letter-spacing:-.035em}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fin-grid div{background:rgba(14,14,16,.08);border-radius:18px;padding:12px;min-width:0}
.fin-grid b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.fin-grid small{font-size:12px;font-weight:700;opacity:.6;margin-left:2px;letter-spacing:0}
.frow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .mid{min-width:0}
.frow .tt{display:block;font-weight:800;font-size:15px}
.frow .meta{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.frow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.frow .rt b{font-weight:800;font-size:15px;white-space:nowrap}
.row2 .apuntar{grid-column:auto;min-height:52px;font-size:15px}
.fin-acts{margin-top:12px}
.fin-acts .ghost{min-height:52px;font-size:15px}
button.frow{width:100%;text-align:left}
.prow.rec{grid-template-columns:1fr auto}
.rec-top{margin-bottom:12px}
.rec-top .nm{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.rec-top .pr-item{margin-top:2px}
.importar{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:52px}
.fileinp{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.finbtn.pub::before{content:none}
.post{background:var(--surface);border-radius:26px;padding:16px;margin-bottom:10px}
.post-h{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:800;font-size:16px}
.post-h .mid{min-width:0}
.post-h b{display:block;font-weight:800;overflow-wrap:anywhere}
.post-h small{display:block;font-size:12px;color:var(--muted)}
.post h3{margin:12px 0 2px;font-weight:800;font-size:19px;letter-spacing:-.02em;overflow-wrap:anywhere}
.post-st{font-size:12.5px;color:var(--muted)}
.post-ex{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.post-ex:last-child{border-bottom:0;padding-bottom:0}
.post-ex .nm{display:block;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.post-ex .ss{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.post-list{margin-top:8px}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk.yo{background:var(--lime-soft)}
.rk .p{font-weight:800;font-size:15px;color:var(--muted);text-align:center}
.rk:first-child .p{color:var(--lime-ink)}
.rk .mid{min-width:0}
.rk .mid b{display:block;font-weight:800;overflow-wrap:anywhere}
.rk .mid small{display:block;font-size:12px;color:var(--muted)}
.rk .v{font-weight:800;font-size:18px;white-space:nowrap;letter-spacing:-.02em}
.rk .v small{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.salir{display:flex;justify-content:center;margin-top:18px}
</style>

<body>
<div class="app">
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="tabbar" aria-label="Secciones">
  <button class="tab" id="tab-entreno" data-vista="entreno" aria-pressed="true">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Entreno
  </button>
  <button class="tab" id="tab-historial" data-vista="historial" aria-pressed="false">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historial
  </button>
  <button class="tab" id="tab-progreso" data-vista="progreso" aria-pressed="false">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso
  </button>
  <button class="tab" id="tab-records" data-vista="records" aria-pressed="false">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 14v5M8 20h8"/></svg>Récords
  </button>
  <button class="tab" id="tab-amigos" data-vista="amigos" aria-pressed="false" hidden>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.5a6 6 0 0 1 3 5.5"/></svg>Amigos
  </button>
</nav>

<script>
const GRUPOS = [
  {id:'pecho', n:'Pecho', ideas:['Press banca','Press inclinado con mancuernas','Aperturas en polea','Fondos','Press declinado','Pec deck']},
  {id:'espalda', n:'Espalda', ideas:['Jalón al pecho','Dominadas','Remo con barra','Remo en polea baja','Remo con mancuerna','Pullover en polea']},
  {id:'hombros', n:'Hombros', ideas:['Press militar','Elevaciones laterales','Pájaros','Face pull','Press Arnold','Elevaciones frontales']},
  {id:'biceps', n:'Bíceps', ideas:['Curl con barra','Curl martillo','Curl inclinado','Curl en polea','Curl predicador']},
  {id:'triceps', n:'Tríceps', ideas:['Press francés','Extensión de tríceps en polea','Fondos en banco','Extensión por encima de la cabeza','Press cerrado']},
  {id:'cuadriceps', n:'Cuádriceps', ideas:['Sentadilla','Prensa','Extensión de cuádriceps','Zancadas','Sentadilla búlgara','Hack squat']},
  {id:'femoral', n:'Femoral', ideas:['Peso muerto rumano','Curl femoral tumbado','Curl femoral sentado','Buenos días']},
  {id:'gluteo', n:'Glúteo', ideas:['Hip thrust','Patada de glúteo','Abducción','Puente de glúteo']},
  {id:'gemelo', n:'Gemelo', ideas:['Gemelo de pie','Gemelo sentado','Gemelo en prensa']},
  {id:'abdominales', n:'Abdominales', ideas:['Crunch en polea','Elevación de piernas','Plancha','Rueda abdominal']},
  {id:'antebrazo', n:'Antebrazo', ideas:['Curl de muñeca','Paseo del granjero']},
];
const GRUPO = Object.fromEntries(GRUPOS.map(g => [g.id, g]));

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-ES', {maximumFractionDigits: 2});
const fmt = n => nf.format(n);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
let hoy = iso(new Date());
const fechaCorta = s => parseISO(s).toLocaleDateString('es-ES', {day:'numeric', month:'short'}).replace('.', '');
const fechaHero = s => parseISO(s).toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'short'}).replace('.', '');
const fechaLarga = s => parseISO(s).toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const lunesDe = f => { const d = parseISO(f); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const sumarDias = (f, n) => { const d = parseISO(f); d.setDate(d.getDate() + n); return iso(d); };
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const claveDe = s => norm(s).replace(/ /g, '-') || 'ejercicio';
const e1rm = s => s.peso * (1 + s.reps / 30);
const clone = o => JSON.parse(JSON.stringify(o));
const volDe = sets => sets.reduce((a, s) => a + s.peso * s.reps, 0);
const ls = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const IDEA_GRUPO = {};
for (const g of GRUPOS) for (const n of g.ideas) IDEA_GRUPO[claveDe(n)] ??= g.id;
function tituloGrupos(ids) {
  const ns = ids.filter(id => GRUPO[id]).map((id, i) => i ? GRUPO[id].n.toLowerCase() : GRUPO[id].n);
  if (!ns.length) return 'Sesión libre';
  return ns.length === 1 ? ns[0] : ns.slice(0, -1).join(', ') + ' y ' + ns.at(-1);
}
const ICON_DOTS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
const ICON_SEARCH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const ICON_CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_RIGHT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- estado ---------- */
function normalizar(s) {
  const ejercicios = (Array.isArray(s.ejercicios) ? s.ejercicios : []).map(e => ({...e, sets: Array.isArray(e.sets) ? e.sets : []}));
  const grupos = Array.isArray(s.grupos) ? s.grupos : [];
  return {...s, ejercicios, grupos, titulo: s.titulo || tituloGrupos(grupos)};
}
const orden = s => s.creada || s.inicio || s.ts || 0;
const ordenar = arr => arr.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : orden(a) - orden(b));
const state = {
  fecha: hoy, vista: 'entreno',
  sesiones: ordenar(ls.get('lh3_sesiones', []).map(normalizar)),
  actual: null,
  plan: null, planFecha: null, editGrupos: false, nueva: false, fechaPrevia: null,
  activo: null, menu: null, borrar: null, setSel: null, inputs: {}, cambiando: null, buscaCambio: '',
  busca: '', buscaProg: '', filtroGrupo: null, filtroRec: null, rango: 7,
  detalle: null, metrica: 'max', histSel: null, borrarSes: false, msgCopia: '',
  modo: 'cargando', cargado: false, aviso: '', hint: null,
  amigos: {pestana: 'feed', feed: null, marcas: null, cargando: false, error: '', ejercicio: null, busca: '', salir: false},
};
let db = null;
const conSets = s => s.ejercicios.some(e => e.sets.length);
const grupoDe = e => e.grupo || IDEA_GRUPO[e.clave] || null;

/* ---------- catálogo y marcas ---------- */
let catCache = null, catFuente = null;
function catalogo() {
  if (catFuente === state.sesiones) return catCache;
  const m = new Map();
  for (const s of state.sesiones) for (const e of s.ejercicios) {
    if (!e.sets.length) continue;
    const c = m.get(e.clave) || {clave: e.clave, nombre: e.nombre, grupo: null, hist: []};
    c.nombre = e.nombre;
    c.grupo = grupoDe(e) || c.grupo || (s.grupos.length === 1 ? s.grupos[0] : null);
    c.hist.push({fecha: s.fecha, id: s.id, orden: orden(s), sets: e.sets});
    m.set(e.clave, c);
  }
  catFuente = state.sesiones; catCache = m;
  return m;
}
function marcas(clave, {excluir, antes} = {}) {
  const c = catalogo().get(clave);
  const hs = (c?.hist || []).filter(h => h.id !== excluir && (!antes || h.fecha < antes.fecha || (h.fecha === antes.fecha && h.orden < orden(antes))));
  if (!hs.length) return null;
  let max = null, rm = null;
  for (const h of hs) for (const s of h.sets) {
    if (!max || s.peso > max.peso || (s.peso === max.peso && s.reps > max.reps)) max = {...s, fecha: h.fecha};
    if (!rm || e1rm(s) > rm.v) rm = {v: e1rm(s), peso: s.peso, reps: s.reps, fecha: h.fecha};
  }
  let rangos = [1, 3, 5, 6, 8, 10, 12, 15, 20].map(r => {
    let b = null;
    for (const h of hs) for (const s of h.sets) if (s.reps >= r && (!b || s.peso > b.peso)) b = {r, peso: s.peso, fecha: h.fecha};
    return b;
  }).filter(Boolean);
  rangos = rangos.filter((b, i) => !(rangos[i + 1] && rangos[i + 1].peso === b.peso));
  return {max, rm, rangos, ultima: hs.at(-1), n: hs.length};
}
/* series que batieron récord respecto a todo lo anterior a esa sesión */
function etiquetas(e, ses) {
  const m = marcas(e.clave, {excluir: ses.id, antes: ses});
  if (!m) return e.sets.map(() => '');
  let maxP = m.max.peso, rmP = m.rm.v;
  return e.sets.map(s => {
    if (s.peso > maxP) { maxP = s.peso; rmP = Math.max(rmP, e1rm(s)); return 'pr'; }
    if (e1rm(s) > rmP) { rmP = e1rm(s); return 'rm'; }
    return '';
  });
}
const nRecords = ses => ses.ejercicios.reduce((a, e) => a + etiquetas(e, ses).filter(t => t === 'pr').length, 0);

/* ---------- sesión actual y guardado ---------- */
const sesionesDe = f => state.sesiones.filter(x => x.fecha === f);
const idNuevo = f => state.sesiones.some(x => x.id === f) ? `${f}-${Date.now().toString(36)}` : f;
function sesion() {
  if (state.nueva) return null;
  if (!state.actual || state.actual.fecha !== state.fecha) {
    const s = sesionesDe(state.fecha).at(-1);
    state.actual = s ? clone(s) : null;
  }
  return state.actual;
}
function setSync(s, txt) { const el = $('#sync'); if (!el) return; el.dataset.s = s; el.textContent = txt; }
function syncListo() { state.modo === 'local' ? setSync('err', 'Solo en este móvil') : setSync('ok', 'Sincronizado'); }

const porGuardar = new Map();
let guardando = false;
function guardarSesion(ses) {
  ses.ts = Date.now();
  ses.titulo = tituloGrupos(ses.grupos);
  const vacia = !ses.ejercicios.length && !ses.grupos.length;
  const resto = state.sesiones.filter(x => x.id !== ses.id);
  state.sesiones = vacia ? resto : ordenar([...resto, clone(ses)]);
  ls.set('lh3_sesiones', state.sesiones);
  const {id, ...doc} = clone(ses);
  porGuardar.set(id, vacia ? null : doc);
  if (!db) { porGuardar.clear(); syncListo(); return; }
  if (!guardando) bucleGuardado();
}
async function bucleGuardado() {
  guardando = true; setSync('pend', 'Guardando…');
  let error = null;
  while (porGuardar.size) {
    const [id, doc] = porGuardar.entries().next().value;
    porGuardar.delete(id);
    const ref = db.doc('sesiones/' + id);
    const op = () => doc ? ref.set(doc) : ref.delete();
    try { await op(); }
    catch (e) {
      try { await new Promise(r => setTimeout(r, 500 + Math.random() * 700)); await op(); }
      catch (e2) { error = e2; }
    }
  }
  guardando = false;
  if (error) setSync('err', error.code === 'quota_exceeded' ? 'Almacenamiento lleno' : 'No se pudo guardar');
  else syncListo();
}

/* ---------- render ---------- */
let renderPendiente = false;
function escribiendo() {
  const a = document.activeElement;
  return a && a.tagName === 'INPUT' && a.closest('#main') && a.type !== 'date';
}
function render(forzar) {
  if (!forzar && escribiendo()) { renderPendiente = true; return; }
  renderPendiente = false;
  for (const v of ['entreno', 'historial', 'progreso', 'records', 'amigos']) $('#tab-' + v).setAttribute('aria-pressed', state.vista === v);
  $('#main').innerHTML = state.vista === 'entreno' ? vistaEntreno() : state.vista === 'historial' ? vistaHistorial() : state.vista === 'records' ? vistaRecords() : state.vista === 'amigos' ? vistaAmigos() : vistaProgreso();
}

/* ---------- entreno ---------- */
function vistaEntreno() {
  const ses = sesion();
  const delDia = sesionesDe(state.fecha);
  const nSes = ses && delDia.length > 1 ? delDia.findIndex(x => x.id === ses.id) + 1 : 0;
  let h = `
  <section class="hero">
    <div class="hero-row">
      <span class="label">${esc(fechaHero(state.fecha))}${state.fecha === hoy ? ' · hoy' : ''}${nSes ? ` · sesión ${nSes}` : ''}</span>
      <div class="hero-acts">
        ${ses && !ses.fin && !state.editGrupos && conSets(ses) ? `<button class="datepill nueva" data-accion="nueva-sesion">+ Nueva</button>` : ''}
        <label class="datepill" for="in-fecha">Otra fecha<input id="in-fecha" type="date" value="${state.fecha}" max="${hoy}" aria-label="Fecha del entreno"></label>
      </div>
    </div>
    <h1>${ses && !state.editGrupos ? esc(ses.titulo) : state.editGrupos ? 'Grupos de la sesión' : state.nueva ? 'Nueva sesión' : '¿Qué toca hoy?'}</h1>
    ${ses && !state.editGrupos && !ses.fin ? `<button class="editg" data-accion="editar-grupos">Cambiar grupos musculares</button>` : ''}
  </section>`;
  if (state.aviso) h += `<div class="aviso">${esc(state.aviso)}</div>`;
  if (!ses && !state.cargado && state.modo === 'cargando') return h + `<div class="empty"><b>Cargando</b>Recuperando tus marcas…</div>`;
  if (!ses || state.editGrupos) return h + planificador(ses);
  if (ses.fin) return h + resumenFin(ses);
  const st = statsSesion(ses);
  if (ses.ejercicios.length) h += `
  <div class="stats">
    <div><div class="label">Ejercicios</div><div class="v num">${ses.ejercicios.length}</div></div>
    <div><div class="label">Series</div><div class="v num">${st.series}</div></div>
    <div><div class="label">Volumen</div><div class="v num">${fmt(Math.round(st.vol))}<small>kg</small></div></div>
    <div><div class="label">Tiempo</div><div class="v num">${st.mins}<small>min</small></div></div>
  </div>`;
  h += `<div class="list">${ses.ejercicios.map((e, i) => bloque(e, i, ses)).join('')}</div>`;
  return h + buscador(ses) + (st.series ? `<button class="finbtn" data-accion="finalizar">Finalizar sesión</button>` : '');
}

function planificador(ses) {
  if (!state.plan || state.planFecha !== state.fecha) {
    state.plan = ses ? [...ses.grupos] : [];
    state.planFecha = state.fecha;
  }
  const texto = ses ? 'Marca los grupos que trabajas en esta sesión.' : 'Marca los grupos musculares que vas a entrenar.';
  return `<section class="next plan">
    <span class="label">Antes de empezar</span>
    <h2 style="margin-top:6px">Grupos musculares</h2>
    <p>${texto}</p>
    <div class="gchips" role="group" aria-label="Grupos musculares">
      ${GRUPOS.map(g => `<button class="gchip" data-accion="grupo" data-g="${g.id}" aria-pressed="${state.plan.includes(g.id)}">${g.n}</button>`).join('')}
    </div>
    <div class="plan-actions">
      ${ses || state.nueva ? `<button class="ghost" data-accion="cancelar-grupos">Cancelar</button>` : ''}
      <button class="apuntar" data-accion="confirmar-grupos" ${state.plan.length ? '' : 'disabled'}>${state.plan.length ? (ses ? 'Guardar grupos' : `Empezar · ${esc(tituloGrupos(GRUPOS.map(g => g.id).filter(id => state.plan.includes(id))))}`) : 'Elige al menos un grupo'}</button>
    </div>
  </section>`;
}

function bloque(e, i, ses) {
  const on = state.activo === e.clave;
  const m = marcas(e.clave, {excluir: ses.id});
  const g = grupoDe(e);

const VACIAS = new Set(['de', 'del', 'al', 'con', 'en', 'la', 'el', 'los', 'las', 'a', 'y', 'x']);
const tokens = t => norm(t).split(' ').filter(w => w && !VACIAS.has(w));
function casiIgual(a, b) {   // distancia de edición ≤ 1
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, dif = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++dif > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return dif + (a.length - i) + (b.length - j) <= 1;
}
function parecido(nombre, q) {

  if (n === q) return 100;

  if (!qt.length) return n.includes(q) ? 40 : 0;

  for (const t of qt) {
    if (nt.some(w => w.startsWith(t))) { ok++; exactas++; }
    else if (t.length >= 4 && nt.some(w => casiIgual(t, w) || casiIgual(t, w.slice(0, t.length)))) ok++;

}

function sugeridos(ses) {

  const puntos = new Map();
  parecidas.forEach((s, i) => {
    for (const e of s.ejercicios) {

      const g = grupoDe(e) || catalogo().get(e.clave)?.grupo;
      if (g && !ses.grupos.includes(g)) continue;
      const p = puntos.get(e.clave) || {clave: e.clave, veces: 0, score: 0};
      p.veces++; p.score += 1 + i / parecidas.length;

function misMarcas() {
  const mapa = new Map();

    const {rm} = marcas(c.clave);
    if (!rm.v || rm.peso > 1000 || rm.reps > 200) continue;
    const clave = claveRanking(c.nombre);
    if (!(mapa.get(clave)?.rm >= rm.v)) mapa.set(clave, {usuario: cuenta.uid, clave, nombre: c.nombre.slice(0, 80), peso: rm.peso, reps: rm.reps, rm: Math.round(rm.v * 10) / 10, fecha: rm.fecha});

async function subirMarcas() {

  await pedir(`marcas?usuario=eq.${cuenta.uid}${lista.length ? `&clave=not.in.(${lista.map(m => m.clave).join(',')})` : ''}`, {method: 'DELETE'});

let toastT = null;
function toast(titulo, texto) {

  el.innerHTML = `<div class="label">${esc(titulo)}</div><b>${esc(texto)}</b>`;

function empezar(nombre) {
  const ses = sesion();
  nombre = nombre.trim().replace(/\s+/g, ' ');
  if (!nombre || !ses) { $('#in-busca')?.focus(); return; }
  nombre = nombre[0].toUpperCase() + nombre.slice(1);
  const clave = claveDe(nombre);
  if (!ses.ejercicios.some(e => e.clave === clave)) {
    const c = catalogo().get(clave);
    const grupo = c?.grupo || IDEA_GRUPO[clave] || (ses.grupos.length === 1 ? ses.grupos[0] : null);
    ses.ejercicios.push({clave, nombre: c?.nombre || nombre, grupo, sets: []});
    guardarSesion(ses);
  }
  state.activo = clave; state.menu = null; state.busca = ''; state.hint = null;
  document.activeElement?.blur();
  render(true);
  document.querySelector(`[data-clave="${CSS.escape(clave)}"]`)?.scrollIntoView({behavior: 'smooth', block: 'start'});
}
function cambiarEjercicio(vieja, nombre) {
  const ses = sesion();
  const e = ses?.ejercicios.find(x => x.clave === vieja);
  nombre = String(nombre || '').trim().replace(/\s+/g, ' ');
  if (!e || !nombre) { document.getElementById('in-cambiar')?.focus(); return; }
  nombre = nombre[0].toUpperCase() + nombre.slice(1);
  const clave = claveDe(nombre), c = catalogo().get(clave);
  const otro = ses.ejercicios.find(x => x.clave === clave && x !== e);
  if (otro) { otro.sets.push(...e.sets); ses.ejercicios = ses.ejercicios.filter(x => x !== e); }
  else {
    e.nombre = c?.nombre || nombre;
    if (clave !== vieja) {
      e.clave = clave;
      e.grupo = c?.grupo || IDEA_GRUPO[clave] || (ses.grupos.length === 1 ? ses.grupos[0] : null);
    }
  }
  if (clave !== vieja) delete state.inputs[vieja];
  state.activo = clave; state.cambiando = null; state.buscaCambio = ''; state.menu = null; state.hint = null;
  document.activeElement?.blur();
  guardarSesion(ses); render(true);
}
function apuntar(form) {
  const ses = sesion();
  const e = ses?.ejercicios.find(x => x.clave === state.activo);
  if (!e) return;
  const peso = num(form.peso.value), reps = num(form.reps.value);
  if (peso == null || peso < 0 || reps == null || reps <= 0) {
    state.hint = {err: reps == null || reps <= 0 ? 'Pon cuántas repeticiones has hecho.' : 'Pon el peso (0 si es con tu peso corporal).'};
    render(true); return;
  }
  const m = marcas(e.clave, {excluir: ses.id, antes: ses});
  const maxAntes = Math.max(m ? m.max.peso : -Infinity, ...e.sets.map(s => s.peso));
  const rmAntes = Math.max(m ? m.rm.v : -Infinity, ...e.sets.map(e1rm));
  const s = {peso, reps, t: Date.now()};
  e.sets.push(s);
  state.inputs[e.clave] = {peso: String(peso), reps: String(reps)};
  state.hint = {nuevo: `${e.clave}:${e.sets.length - 1}`};
  state.setSel = null;
  document.activeElement?.blur();
  guardarSesion(ses);
  render(true);
  if (m && peso > maxAntes) toast('Nuevo récord de peso', `${fmt(peso)} kg × ${fmt(reps)}`);
  else if (m && e1rm(s) > rmAntes) toast('Nuevo 1RM estimado', `${fmt(Math.round(e1rm(s) * 2) / 2)} kg`);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-accion], [data-vista]');
  if (!b) return;
  if (b.dataset.vista) {
    state.vista = b.dataset.vista; state.detalle = null; state.histSel = null; state.borrarSes = false; state.amigos.ejercicio = null;
    render(true); scrollTo(0, 0);
    if (state.vista === 'amigos') cargarAmigos();
    return;
  }
  const acc = b.dataset.accion;
  const clave = b.closest('[data-clave]')?.dataset.clave;
  const ses = state.vista === 'entreno' ? sesion() : null;
  switch (acc) {
    case 'grupo': {
      const g = b.dataset.g;
      state.plan = state.plan.includes(g) ? state.plan.filter(x => x !== g) : [...state.plan, g];
      render(true); break;
    }
    case 'confirmar-grupos': {
      if (!state.plan.length) return;
      const grupos = GRUPOS.map(g => g.id).filter(id => state.plan.includes(id));
      if (ses) ses.grupos = grupos;
      else {
        const previa = state.nueva ? state.actual : null;
        if (previa && !previa.fin && conSets(previa)) {
          previa.fin = Math.max(0, ...previa.ejercicios.flatMap(e => e.sets.map(x => x.t || 0))) || Date.now();
          guardarSesion(previa);
        }
        state.actual = {id: idNuevo(state.fecha), fecha: state.fecha, grupos, titulo: '', ts: 0, creada: Date.now(), inicio: state.fecha === hoy ? Date.now() : undefined, ejercicios: []};
        state.nueva = false;
      }
      guardarSesion(state.actual);
      state.editGrupos = false; state.plan = null;
      render(true); scrollTo(0, 0); break;
    }
    case 'editar-grupos': state.editGrupos = true; state.plan = null; render(true); break;
    case 'cancelar-grupos':
      if (state.nueva) { state.nueva = false; state.fecha = state.fechaPrevia; abrirUltimo(); }
      state.editGrupos = false; state.plan = null; render(true); break;
    case 'nueva-sesion':
      state.fechaPrevia = state.fecha; state.fecha = hoy; state.nueva = true;
      state.editGrupos = false; state.plan = null; state.busca = '';
      state.activo = state.menu = state.cambiando = state.setSel = state.hint = null;
      render(true); scrollTo(0, 0); break;
    case 'activar': state.activo = state.activo === clave ? null : clave; state.menu = state.setSel = state.cambiando = null; state.hint = null; render(true); break;
    case 'menu': state.menu = state.menu === clave ? null : clave; state.borrar = null; state.cambiando = null; render(true); break;
    case 'cambiar': state.cambiando = clave; state.buscaCambio = ''; state.menu = null; render(true); document.getElementById('in-cambiar')?.focus(); break;
    case 'cancelar-cambio': state.cambiando = null; render(true); break;
    case 'cambiar-a': cambiarEjercicio(clave, b.dataset.nombre); break;
    case 'set-grupo': {
      const e = ses.ejercicios.find(x => x.clave === clave);
      e.grupo = b.dataset.g; guardarSesion(ses); render(true); break;
    }
    case 'quitar':
      if (state.borrar !== clave) { state.borrar = clave; render(true); return; }
      ses.ejercicios = ses.ejercicios.filter(x => x.clave !== clave);
      state.borrar = state.menu = state.activo = null;
      guardarSesion(ses); render(true); break;
    case 'set': { const sel = `${clave}:${b.dataset.k}`; state.setSel = state.setSel === sel ? null : sel; render(true); break; }
    case 'borrar-set': {
      ev.stopPropagation();
      ses.ejercicios.find(x => x.clave === clave).sets.splice(+b.dataset.k, 1);
      state.setSel = null; state.hint = null;
      guardarSesion(ses); render(true); break;
    }
    case 'paso': {
      const inp = state.inputs[clave];
      const c = b.dataset.c;
      inp[c] = String(Math.max(0, Math.round(((num(inp[c]) ?? 0) + +b.dataset.d) * 100) / 100));
      const el = document.getElementById(c === 'peso' ? 'in-peso' : 'in-reps');
      if (el) el.value = inp[c].replace('.', ',');
      break;
    }
    case 'empezar': empezar(b.dataset.nombre); break;
    case 'finalizar': {
      ses.fin = Date.now(); state.activo = state.menu = state.cambiando = null;
      guardarSesion(ses); render(true); scrollTo(0, 0);
      const st = statsSesion(ses);
      toast('Entreno terminado', `${st.mins} min · ${st.series} series`);
      if (ses.publicada) publicar(ses, true);
      break;
    }
    case 'publicar': publicar(ses); break;
    case 'despublicar': despublicar(ses); break;
    case 'compartir-app': compartirApp(); break;
    case 'pestana-amigos': state.amigos.pestana = b.dataset.p; render(true); if (!state.amigos.feed) cargarAmigos(); break;
    case 'ver-ranking': state.amigos.ejercicio = b.dataset.clave; render(true); scrollTo(0, 0); break;
    case 'volver-ranking': state.amigos.ejercicio = null; render(true); break;
    case 'borrar-cuenta':
      if (!state.amigos.salir) { state.amigos.salir = true; render(true); return; }
      borrarCuenta(); break;
    case 'reabrir':
      delete ses.fin; guardarSesion(ses);
      if (ses.ejercicios.length) state.activo = ses.ejercicios.at(-1).clave;
      render(true); break;
    case 'exportar': exportar(); break;
    case 'ver-progreso': state.vista = 'progreso'; state.detalle = clave; state.menu = null; render(true); scrollTo(0, 0); break;
    case 'ver-sesion': state.histSel = b.dataset.id; state.borrarSes = false; render(true); scrollTo(0, 0); break;
    case 'volver-hist': state.histSel = null; state.borrarSes = false; render(true); break;
    case 'editar-sesion': {
      const s = state.sesiones.find(x => x.id === b.dataset.id);
      if (!s) return;
      state.vista = 'entreno'; state.fecha = s.fecha; state.actual = clone(s); state.nueva = false; state.activo = null; state.histSel = null; state.editGrupos = false;
      abrirUltimo(); render(true); scrollTo(0, 0); break;
    }
    case 'borrar-sesion': {
      if (!state.borrarSes) { state.borrarSes = true; render(true); return; }
      const s = state.sesiones.find(x => x.id === b.dataset.id);
      if (s) {
        if (s.publicada) quitarRemota(s.id).catch(() => {});
        const v = clone(s); v.ejercicios = []; v.grupos = []; guardarSesion(v);
      }
      if (state.actual?.id === b.dataset.id) state.actual = null;
      state.histSel = null; state.borrarSes = false; render(true); break;
    }
    case 'detalle': state.detalle = b.dataset.clave; render(true); scrollTo(0, 0); break;
    case 'volver': state.detalle = null; render(true); break;
    case 'metrica': state.metrica = b.dataset.m; render(true); break;
    case 'rango': state.rango = +b.dataset.r; render(true); break;
    case 'filtro-rec': state.filtroRec = b.dataset.g || null; render(true); break;
    case 'filtro':
      state.filtroGrupo = b.dataset.g || null;
      $('#prog-list').innerHTML = listaProgreso();
      document.querySelectorAll('[data-accion="filtro"]').forEach(x => x.setAttribute('aria-pressed', (x.dataset.g || null) === state.filtroGrupo));
      break;
  }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.dataset.form === 'buscar') empezar(mejorCoincidencia(f.q.value));
  if (f.dataset.form === 'serie') apuntar(f);
  if (f.dataset.form === 'alta') entrar(f.nombre.value);
  if (f.dataset.form === 'cambiar') cambiarEjercicio(state.cambiando, mejorCoincidencia(f.q.value));
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'in-busca') { state.busca = el.value; $('#res').innerHTML = resultados(); return; }
  if (el.id === 'in-cambiar') { state.buscaCambio = el.value; $('#res-cambiar').innerHTML = resultados(el.value, 'cambiar-a'); return; }
  if (el.id === 'in-busca-rk') { state.amigos.busca = el.value; $('#rk-list').innerHTML = listaClasificacion(); return; }
  if (el.id === 'in-busca-prog') { state.buscaProg = el.value; $('#prog-list').innerHTML = listaProgreso(); return; }
  if (el.id === 'in-peso' || el.id === 'in-reps') {
    const limpio = el.value.replace(/[^\d.,]/g, '');
    if (limpio !== el.value) el.value = limpio;
    const inp = state.inputs[state.activo];
    if (inp) inp[el.id === 'in-peso' ? 'peso' : 'reps'] = limpio.replace(',', '.');
    if (state.hint?.err) { state.hint = null; const h = el.closest('form').querySelector('.hint'); if (h) { h.classList.remove('err'); h.textContent = 'Toca una serie para borrarla.'; } }
  }
});
document.addEventListener('focusin', ev => { if (ev.target.id === 'in-peso' || ev.target.id === 'in-reps') ev.target.select?.(); });
document.addEventListener('change', ev => {
  if (ev.target.id === 'in-fecha' && ev.target.value) {
    state.fecha = ev.target.value > hoy ? hoy : ev.target.value;
    state.editGrupos = false; state.plan = null;
    if (!state.nueva) { state.actual = null; state.activo = null; abrirUltimo(); }
    ev.target.blur(); render(true);
  }
});
document.addEventListener('focusout', () => setTimeout(() => { if (renderPendiente && !escribiendo()) render(); }, 0));
/* el iPhone puede dejar la app abierta de un día para otro; una sesión a medias se queda donde está */
document.addEventListener('visibilitychange', () => {
  const ahora = iso(new Date());
  if (document.hidden || ahora === hoy) return;
  const ayer = hoy, ses = state.actual;
  hoy = ahora;
  if (state.fecha === ayer && !state.nueva && !(ses && !ses.fin && conSets(ses))) { state.fecha = hoy; state.actual = null; state.activo = null; state.plan = null; abrirUltimo(); }
  render();
});

/* ---------- arranque ---------- */
function abrirUltimo() {
  const ses = sesion();
  if (!state.activo && ses?.ejercicios.length) state.activo = ses.ejercicios.at(-1).clave;
}
function modoLocal() {
  state.modo = 'local'; state.cargado = true;
  state.aviso = 'Sin conexión con tu cuenta: lo que apuntes se guarda solo en este navegador.';
  syncListo(); render();
}
async function iniciar() {
  state.modo = 'local'; state.cargado = true;
  if (nubeLista()) { $('#tab-amigos').hidden = false; $('.tabbar').style.setProperty('--tabs', 5); }
  abrirUltimo(); render(true);
  try { await navigator.storage?.persist?.(); } catch {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
}
iniciar();
</script>
